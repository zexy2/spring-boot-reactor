    <text x="23" y="34" font-size="13" font-family="monospace" font-weight="bold" letter-spacing="2" fill="#4ed8cd">İNTERAKTİF ÇALIŞMA YOLU</text>

    <g transform="translate(24 58)">
      <rect width="292" height="42" fill="#172537" stroke="#ffb65c"/>
      <rect width="40" height="42" fill="#ffb65c"/>
      <text x="20" y="27" font-size="16" text-anchor="middle" font-weight="bold" fill="#101a24">01</text>
      <text x="56" y="27" font-size="16" font-weight="bold" fill="#ecf2ff">ÖĞREN</text>
    </g>
    <g transform="translate(24 112)">
      <rect width="292" height="42" fill="#142338" stroke="#42617c"/>
      <rect width="40" height="42" fill="#19354c"/>
      <text x="20" y="27" font-size="16" text-anchor="middle" font-weight="bold" fill="#4ed8cd">02</text>
      <text x="56" y="27" font-size="16" font-weight="bold" fill="#ecf2ff">UYGULA</text>
    </g>
    <g transform="translate(24 166)">
      <rect width="292" height="42" fill="#142338" stroke="#42617c"/>
      <rect width="40" height="42" fill="#19354c"/>
      <text x="20" y="27" font-size="16" text-anchor="middle" font-weight="bold" fill="#4ed8cd">03</text>
      <text x="56" y="27" font-size="16" font-weight="bold" fill="#ecf2ff">HATIRLA / TEST ET</text>
