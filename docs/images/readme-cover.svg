<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="324" viewBox="0 0 1200 324" role="img" aria-labelledby="title desc">
  <title id="title">Java Backend Öğrenme Atölyesi</title>
  <desc id="desc">Koyu lacivert bir zemin üzerinde turuncu ve turkuaz vurgular, 102 ders ve üç aşamalı öğrenme akışı.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08101d"/>
      <stop offset="1" stop-color="#0c2130"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#253b51" stroke-opacity=".32" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="324" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="324" rx="16" fill="url(#grid)"/>
  <path d="M0 320 H1200" stroke="#54dacf" stroke-width="4"/>

  <g transform="translate(52 44)">
    <rect width="58" height="58" fill="#101e2d" stroke="#ffb65c" stroke-width="2"/>
