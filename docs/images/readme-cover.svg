    <text x="80" y="22" fill="#8daac0" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="3">ENGINEERING LEARNING LAB</text>
    <path d="M80 35 H380" stroke="#334b61"/>
  </g>

  <g transform="translate(53 143)" font-family="Arial, Helvetica, sans-serif" font-weight="900">
