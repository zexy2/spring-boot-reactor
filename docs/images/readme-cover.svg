    <text x="0" y="59" font-size="48" fill="#ffb65c" letter-spacing=".5">ÖĞRENME ATÖLYESİ</text>
  </g>
  <text x="55" y="246" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#a1b4c8">Kavramı anla. Gerçek senaryoda uygula. Hatırla ve geliştir.</text>

  <g transform="translate(807 44)" font-family="Arial, Helvetica, sans-serif">
